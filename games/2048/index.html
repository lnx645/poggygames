<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<link rel="icon" href="data:," />
<title>2048 — PoggyGames</title>
<style>
  body{margin:0; background:#faf8ef; color:#776e65; font-family:system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; user-select:none}
  h1{font-size:34px; margin:0}
  .atas{display:flex; align-items:center; gap:12px; width:min(440px,94vw); justify-content:space-between}
  .kotak-skor{background:#bbada0; color:#fff; border-radius:8px; padding:6px 14px; text-align:center; font-weight:800}
  .kotak-skor small{display:block; font-size:10px; letter-spacing:1px; opacity:.85}
  button{background:#8f7a66; color:#fff; border:none; font-weight:800; padding:10px 16px; border-radius:8px; cursor:pointer}
  #papan{position:relative; background:#bbada0; border-radius:10px; margin-top:16px; touch-action:none}
  .sel{position:absolute; border-radius:7px; display:flex; align-items:center; justify-content:center; font-weight:900; transition:top .09s, left .09s}
  .pesan{margin-top:14px; font-weight:800; min-height:22px; text-align:center}
  p.petunjuk{font-size:13px; text-align:center; max-width:440px}
</style>
</head>
<body>
<div class="atas">
  <h1>2048</h1>
  <div style="display:flex; gap:8px; align-items:center">
    <div class="kotak-skor"><small>SKOR</small><span id="skor">0</span></div>
    <div class="kotak-skor"><small>TERBAIK</small><span id="terbaik">0</span></div>
    <button id="baru">Baru</button>
  </div>
</div>
<p style="margin:8px 0 0">Gabungkan ubin bernomor sama sampai dapat <b>2048</b>!</p>
<div id="papan"></div>
<div class="pesan" id="pesan"></div>
<p class="petunjuk">Kontrol: tombol panah / WASD / usap layar</p>
<script>
const N = 4, UK = Math.min(100, Math.floor((Math.min(innerWidth - 32, 440) - 36) / 4)), CEL = 10;
const papan = document.getElementById('papan');
papan.style.width = papan.style.height = (N * UK + (N + 1) * CEL) + 'px';
const WARNA = { 2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e' };
const TEKS = v => v <= 4 ? '#776e65' : '#f9f6f2';
let grid, skor, selesai;
let terbaik = parseInt(localStorage.getItem('poggy_2048_terbaik') || '0', 10);
document.getElementById('terbaik').textContent = terbaik;

function acakKosong(){
  const kosong = [];
  grid.forEach((baris, y) => baris.forEach((v, x) => { if (!v) kosong.push([x, y]); }));
  if (!kosong.length) return;
  const [x, y] = kosong[Math.floor(Math.random() * kosong.length)];
  grid[y][x] = Math.random() < 0.9 ? 2 : 4;
}
function gambar(){
  papan.querySelectorAll('.sel').forEach(e => e.remove());
  grid.forEach((baris, y) => baris.forEach((v, x) => {
    if (!v) return;
    const d = document.createElement('div');
    d.className = 'sel'; d.textContent = v;
    d.style.width = d.style.height = UK + 'px';
    d.style.left = (CEL + x * (UK + CEL)) + 'px';
    d.style.top = (CEL + y * (UK + CEL)) + 'px';
    d.style.background = WARNA[v] || '#edc22e';
    d.style.color = TEKS(v);
    d.style.fontSize = (v >= 1024 ? UK * 0.3 : UK * 0.42) + 'px';
    papan.appendChild(d);
  }));
  document.getElementById('skor').textContent = skor;
}
function geserBaris(baris){
  const isi = baris.filter(v => v);
  for (let i = 0; i < isi.length - 1; i++){
    if (isi[i] === isi[i + 1]){ isi[i] *= 2; skor += isi[i]; isi.splice(i + 1, 1); }
  }
  while (isi.length < N) isi.push(0);
  return isi;
}
function gerak(arahGeser){
  if (selesai) return;
  const sebelum = JSON.stringify(grid);
  let g = grid.map(r => [...r]);
  const putar = m => m[0].map((_, i) => m.map(r => r[i]).reverse());
  const putarBalik = m => m[0].map((_, i) => m.map(r => r[i])).reverse();
  if (arahGeser === 'atas'){ g = putarBalik(g); g = g.map(geserBaris); g = putar(g); }
  if (arahGeser === 'bawah'){ g = putar(g); g = g.map(geserBaris); g = putarBalik(g); }
  if (arahGeser === 'kanan'){ g = g.map(r => geserBaris([...r].reverse()).reverse()); }
  if (arahGeser === 'kiri'){ g = g.map(geserBaris); }
  if (JSON.stringify(g) === sebelum) return;
  grid = g; acakKosong(); gambar(); cekAkhir();
}
function cekAkhir(){
  if (grid.flat().includes(2048) && !selesai){
    selesai = true;
    document.getElementById('pesan').textContent = '🎉 Kamu dapat 2048! Tekan Baru untuk main lagi.';
    simpanTerbaik(); return;
  }
  const penuh = grid.flat().every(v => v);
  if (penuh){
    let bisa = false;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
      if (x < N - 1 && grid[y][x] === grid[y][x + 1]) bisa = true;
      if (y < N - 1 && grid[y][x] === grid[y + 1][x]) bisa = true;
    }
    if (!bisa){ selesai = true; document.getElementById('pesan').textContent = `😵 Papan penuh! Skor akhir ${skor}.`; simpanTerbaik(); }
  }
}
function simpanTerbaik(){
  if (skor > terbaik){ terbaik = skor; localStorage.setItem('poggy_2048_terbaik', String(terbaik)); document.getElementById('terbaik').textContent = terbaik; }
}
function baru(){
  grid = Array.from({ length: N }, () => Array(N).fill(0));
  skor = 0; selesai = false;
  document.getElementById('pesan').textContent = '';
  acakKosong(); acakKosong(); gambar();
}
const TOMBOL = { ArrowUp:'atas', ArrowDown:'bawah', ArrowLeft:'kiri', ArrowRight:'kanan', w:'atas', s:'bawah', a:'kiri', d:'kanan' };
addEventListener('keydown', e => { if (TOMBOL[e.key]) { e.preventDefault(); gerak(TOMBOL[e.key]); } });
let sentuh = null;
papan.addEventListener('touchstart', e => { sentuh = e.touches[0]; }, { passive:true });
papan.addEventListener('touchend', e => {
  if (!sentuh) return;
  const t = e.changedTouches[0], dx = t.clientX - sentuh.clientX, dy = t.clientY - sentuh.clientY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 24)
    gerak(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'kanan' : 'kiri') : (dy > 0 ? 'bawah' : 'atas'));
  sentuh = null;
}, { passive:true });
document.getElementById('baru').onclick = baru;
baru();
</script>
</body>
</html>
