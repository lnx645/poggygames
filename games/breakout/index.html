<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<link rel="icon" href="data:," />
<title>Breakout — PoggyGames</title>
<style>
  body{margin:0; background:#1e1b4b; color:#eef2ff; font-family:system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; padding:14px; user-select:none}
  h1{font-size:20px; margin:2px 0 8px}
  .skor{display:flex; gap:22px; font-weight:700; margin-bottom:10px}
  .skor b{color:#f472b6}
  canvas{background:#111034; border:3px solid #4338ca; border-radius:10px; max-width:94vw; touch-action:none}
  .pesan{min-height:22px; margin:10px 0; color:#fbbf24; font-weight:700}
  button{background:#4f46e5; color:#fff; border:none; font-weight:800; padding:10px 22px; border-radius:10px; cursor:pointer; font-size:15px}
  p{color:#a5b4fc; font-size:13px}
</style>
</head>
<body>
<h1>🧱 Breakout</h1>
<div class="skor"><span>Skor: <b id="skor">0</b></span><span>Nyawa: <b id="nyawa">3</b></span><span>Level: <b id="level">1</b></span></div>
<canvas id="papan" width="480" height="400"></canvas>
<div class="pesan" id="pesan">Gerakkan mouse / jari untuk menggerakkan papan. Klik untuk mulai!</div>
<button id="mulai">▶ Mulai / Ulang</button>
<p>Kontrol: mouse, sentuh, atau tombol panah kiri/kanan</p>
<script>
const cv = document.getElementById('papan'), ctx = cv.getContext('2d');
const el = id => document.getElementById(id);
const WARNA = ['#ef4444', '#f97316', '#facc15', '#22c55e', '#3b82f6'];
let papan, bola, bata, skor, nyawa, level, jalan, kunci = {};
function buatBata(){
  bata = [];
  const kolom = 8, baris = 4 + Math.min(level - 1, 3);
  for (let r = 0; r < baris; r++)
    for (let c = 0; c < kolom; c++)
      bata.push({ x: 34 + c * 52, y: 44 + r * 22, w: 46, h: 15, warna: WARNA[r % WARNA.length], hidup: true });
}
function aturUlangBola(){
  bola = { x: 240, y: 300, vx: 3 * (Math.random() > 0.5 ? 1 : -1), vy: -3.6 - level * 0.3 };
  papan.x = 200;
}
function aturUlang(){
  papan = { x: 200, y: 372, w: 84, h: 12 };
  skor = 0; nyawa = 3; level = 1;
  el('skor').textContent = '0'; el('nyawa').textContent = '3'; el('level').textContent = '1';
  buatBata(); aturUlangBola();
}
function gambar(){
  ctx.clearRect(0, 0, 480, 400);
  bata.forEach(b => { if (b.hidup){ ctx.fillStyle = b.warna; ctx.fillRect(b.x, b.y, b.w, b.h); } });
  ctx.fillStyle = '#e0e7ff';
  ctx.fillRect(papan.x, papan.y, papan.w, papan.h);
  ctx.beginPath(); ctx.arc(bola.x, bola.y, 8, 0, 7); ctx.fillStyle = '#f472b6'; ctx.fill();
}
function langkah(){
  if (kunci.ArrowLeft) papan.x -= 6;
  if (kunci.ArrowRight) papan.x += 6;
  papan.x = Math.max(0, Math.min(480 - papan.w, papan.x));
  bola.x += bola.vx; bola.y += bola.vy;
  if (bola.x < 8 || bola.x > 472) bola.vx *= -1;
  if (bola.y < 8) bola.vy *= -1;
  if (bola.y > 392){
    nyawa--; el('nyawa').textContent = nyawa;
    if (nyawa <= 0){ jalan = false; el('pesan').textContent = `😵 Habis nyawa! Skor akhir ${skor}.`; gambar(); return; }
    el('pesan').textContent = 'Bola jatuh! Sisa nyawa ' + nyawa;
    aturUlangBola();
  }
  if (bola.y + 8 > papan.y && bola.y < papan.y + papan.h && bola.x > papan.x && bola.x < papan.x + papan.w && bola.vy > 0){
    const rel = (bola.x - (papan.x + papan.w / 2)) / (papan.w / 2);
    const laju = Math.hypot(bola.vx, bola.vy);
    bola.vx = rel * laju * 0.9;
    bola.vy = -Math.sqrt(Math.max(laju * laju - bola.vx * bola.vx, 1));
  }
  for (const b of bata){
    if (!b.hidup) continue;
    if (bola.x > b.x - 6 && bola.x < b.x + b.w + 6 && bola.y > b.y - 6 && bola.y < b.y + b.h + 6){
      b.hidup = false; bola.vy *= -1; skor += 10; el('skor').textContent = skor; break;
    }
  }
  if (bata.every(b => !b.hidup)){
    level++; el('level').textContent = level;
    el('pesan').textContent = '🎉 Level ' + level + '! Makin cepat…';
    buatBata(); aturUlangBola();
  }
  gambar();
  if (jalan) requestAnimationFrame(langkah);
}
function mulai(){
  if (jalan) return;
  aturUlang(); jalan = true;
  el('pesan').textContent = 'Hancurkan semua batanya! 🧱';
  requestAnimationFrame(langkah);
}
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect();
  papan.x = ((e.clientX - r.left) / r.width) * 480 - papan.w / 2;
});
cv.addEventListener('pointerdown', mulai);
addEventListener('keydown', e => { kunci[e.key] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup', e => { kunci[e.key] = false; });
document.getElementById('mulai').onclick = () => { jalan = false; mulai(); };
aturUlang(); gambar();
</script>
</body>
</html>
